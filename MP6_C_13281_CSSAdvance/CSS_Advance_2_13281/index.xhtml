<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN"
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="id" lang="id">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <title>Formulir Pendaftaran</title>
    <link rel="stylesheet" type="text/css" href="style.css"/>
</head>
<body>
    <h1>Formulir Pendaftaran</h1>
    <form action="" method="post" enctype="multipart/form-data">

        <h2>Pendataan</h2>
        <table>
            <tr>
                <td>
                    <label for="nama_tim"><strong>Nama Kelompok :</strong></label>
                </td>
                <td>
                    <input type="text" id="nama_tim" name="nama_tim" size="30" />
                </td>
            </tr>
            <tr>
                <td>
                    <label for="nama_ketua"><strong>Nama Ketua : </strong></label>
                </td>
                <td>
                    <input type="text" id="nama_ketua" name="nama_ketua" size="30" />
                </td>
            </tr>
            <tr>
                <td>
                    <label for="jumlah"><strong>Nama Anggota 1 : </strong></label>
                </td>
                <td>
                    <input type="text" id="ang1" name="ang1" size="10" />
                </td>
            </tr>

            <tr>
                <td>
                    <label for="jumlah"><strong>Nama Anggota 2 :</strong></label>
                </td>
                <td>
                    <input type="text" id="ang2" name="ang2" size="10" />
                </td>
            </tr>
            <tr>
                <td>
                    <label for="prodi"><strong>Topik : </strong></label>
                </td>
                <td>
                    <select id="topik" name="topik">
                        <option>Tanpa Kemiskinan</option>
                        <option>Tanpa Kelaparan</option>
                        <option>Kehidupan Sehat dan Sejahtera</option>
                        <option>Pendidikan Berkualitas</option>
                        <option>Kesetaraan Gender</option>
                        <option>Air Bersih dan Sanitasi Layak</option>
                        <option>Energi Bersih dan Terjangkau</option>
                        <option>Pekerjaan Layak dan Pertumbuhan Ekonomi</option>
                        <option>Industri, Inovasi, dan Infrastruktur</option>
                        <option>Berkurangnya Kesenjangan</option>
                        <option>Kota dan Permukiman yang Berkelanjutan</option>
                        <option>Konsumsi dan Produksi yang Bertanggung Jawab</option>
                        <option>Penanganan Perubahan Iklim</option>
                        <option>Ekosistem Laut</option>
                        <option>Ekosistem Darat</option>
                        <option>Perdamaian, Keadilan, dan Kelembagaan yang Tangguh</option>
                        <option>Kemitraan untuk Mencapai Tujuan</option>
                    </select>
                </td>
            </tr>
        </table>

        <h2>Pilihan Lomba</h2>
        <table>
            <tr>
                <td>
                    <strong>Universitas : </strong>
                </td>
                <td>
                    <input type="radio" id="uajy" name="kategori"
                        value="Uajy" />
                    <label for="uajy">Atma Jaya Yogyakarta</label>

                    <input type="radio" id="luar" name="kategori"
                        value="Luar" />
                    <label for="luar">Universitas Lain</label>
                </td>
            </tr>
            <tr>
                <td>
                    <strong>Bidang Lomba :</strong>
                </td>
                <td>
                    <p>
                        <input type="checkbox" id="programming" name="bidang"
                            value="Programming" />
                        <label for="programming">Programming</label>
                    </p>
                    <p>
                        <input type="checkbox" id="uiux" name="bidang"
                            value="UI/UX Design" />
                        <label for="uiux">UI/UX Design</label>
                    </p>
                    <p>
                        <input type="checkbox" id="karya_tulis" name="bidang"
                            value="Karya Tulis" />
                        <label for="karya_tulis">Karya Tulis</label>
                    </p>
                </td>
            </tr>
        </table>

        <h2>Informasi Karya</h2>
        <table cellspacing="4" cellpadding="4" border="1" style="border-collapse:collapse; width:100%;">
            <tr>
                <td style="width:32%;">
                    <label for="deskripsi"><strong>Deskripsi Karya :</strong></label>
                </td>
                <td>
                    <textarea id="deskripsi" name="deskripsi"
                        rows="8" cols="30"></textarea>
                </td>
            </tr>
            <tr>
                <td style="width:32%;">
                    <label for="file_karya"><strong>File Karya :</strong></label>
                </td>
                <td>
                    <input type="file" id="file_karya" name="file_karya" />
                </td>
            </tr>
            <tr>
                <td colspan="2" style="text-align:center;">
                    <input type="submit" name="daftar" value="Daftar" />
                </td>
            </tr>
        </table>
    </form>
</body>
</html>

<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN"
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="id" lang="id">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <title>Formulir Pendaftaran</title>
    <link rel="stylesheet" type="text/css" href="style.css"/>
</head>
<body>
    <h1>Formulir Pendaftaran</h1>
    <form action="" method="post" enctype="multipart/form-data">
        <div class = "tabel">
            <table>
                <tr>
                    <td>
                        <label for="nama"><strong>Nama : </strong></label>
                    </td>
                    <td>
                        <input type="text" id="nama" name="nama" size="30" />
                    </td>
                </tr>
                <tr>
                    <td>
                        <label for="email"><strong>Email : </strong></label>
                    </td>
                    <td>
                        <input type="text" id="email" name="email" size="30" />
                    </td>
                </tr>
                <tr>
                    <td>
                        <label for="notel"><strong>No Telepon : </strong></label>
                    </td>
                    <td>
                        <input type="text" id="notel" name="notel" size="30" />
                    </td>
                </tr>
                <tr>
                    <td>
                        <label for="jenis"><strong>Pekerjaan : </strong></label>
                    </td>
                    <td>
                        <select id="role" name="role">
                            <option>Mahasiswa/i</option>
                            <option>Guru / Dosen</option>
                            <option>CEO</option>
                            <option>Akuntan</option>
                            <option>Dll</option>
                        </select>
                    </td>
                </tr>
                <tr>
                    <td>
                        <strong>Tempat Duduk : </strong>
                    </td>
                    <td>
                        <input type="radio" id="reguler" name="tiket"
                            value="Reguler" />
                        <label for="reguler">Reguler</label>

                        <input type="radio" id="vip" name="tiket"
                            value="VIP" />
                        <label for="vip">VIP</label>

                        <input type="radio" id="online" name="tiket"
                            value="Online" />
                        <label for="online">Online</label>
                    </td>
                </tr>
                <tr>
                    <td style="vertical-align:top;">
                        <strong>Topik :</strong>
                    </td>
                    <td>
                        <p>
                            <input type="checkbox" id="ai" name="topik"
                                value="AI" />
                            <label for="ai">Artificial Intelligence (AI)</label>
                        </p>
                        <p>
                            <input type="checkbox" id="data" name="topik"
                                value="Data Science" />
                            <label for="data">Data Science</label>
                        </p>
                        <p>
                            <input type="checkbox" id="cyber" name="topik"
                                value="Cyber Security" />
                            <label for="cyber">Cyber Security</label>
                        </p>
                        <p>
                            <input type="checkbox" id="cloud" name="topik"
                                value="Cloud Computing" />
                            <label for="cloud">Cloud Computing</label>
                        </p>
                        <p>
                            <input type="checkbox" id="web" name="topik"
                                value="Web Development" />
                            <label for="web">Web Development</label>
                        </p>
                    </td>
                </tr>
                <tr>
                    <td>
                        <label for="jam"><strong>Pilihan Jam</strong></label>
                    </td>
                    <td>
                        <select id="jam" name="jam">
                            <option>08.00 - 10.00</option>
                            <option>10.00 - 12.00</option>
                            <option>13.00 - 15.00</option>
                            <option>15.00 - 17.00</option>
                            <option>19.00 - 21.00</option>
                        </select>
                    </td>
                </tr>
                <tr>
                    <td style="vertical-align:top;">
                        <strong>Cara Pembayaran :</strong>
                    </td>
                    <td>
                        <p>
                            <input type="radio" id="qris" name="pembayaran"
                                value="QRIS" />
                            <label for="qris">QRIS</label>
                        </p>
                        <p>
                            <input type="radio" id="transfer" name="pembayaran"
                                value="Transfer Bank" />
                            <label for="transfer">Transfer Bank</label>
                        </p>
                    </td>
                </tr>
                <tr>
                    <td style="vertical-align:top;">
                        <label for="pertanyaan">
                            <strong>Pertanyaan : </strong>
                        </label>
                    </td>
                    <td>
                        <textarea id="pertanyaan" name="pertanyaan"
                            rows="8" cols="30" placeholder= 'Jika tidak ada pertanyaan, silahkan hanya "-" '></textarea>
                    </td>
                </tr>
                <tr>
                    <td>
                        <label for="bukti"><strong>Bukti Pembayaran</strong></label>
                    </td>
                    <td>
                        <input type="file" id="bukti" name="bukti"
                            accept="image/gif, image/jpeg, image/png" />
                    </td>
                </tr>

                <tr>
                    <td colspan="2" style="text-align:center;">
                        <input type="submit" name="simpan" value="Simpan" />
                    </td>
                </tr>
            </table>
        </div>
    </form>
</body>
</html>

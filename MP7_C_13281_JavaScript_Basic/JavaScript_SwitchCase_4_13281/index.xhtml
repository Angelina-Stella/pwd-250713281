<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN"

<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="id" lang="id">
<head>
    <title>If-Else Internal : Wahana Taman Hiburan</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <script type="text/javascript">
        var sInput;

        sInput = prompt("Pilih ruang: (B)aca, (D)iskusi, (K)omputer, (A)udio Visual", "B");

        switch(sInput){
            case "B":
                alert("Ruang Baca di lantai 1");
                break;

            case "D":
                alert("Ruang Baca di lantai 1");
                break;

            case "K":
                alert("Ruang Baca di lantai 1");
                break;

            case "A":
                alert("Ruang Baca di lantai 1");
                break;

            default:
                alert("Ruang tidak ditemukan");
        }
    </script>
</head>

<body>
    <h1>Switch-Case: Ruang Perpusatakaan</h1>
    <p>Reload halaman untuk mencoba lagi.</p>
</body>

</html>
